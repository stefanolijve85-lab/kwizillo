# Kwizillo voor scholen: school.kwizillo.nl -> the same Node service as the app
# (on the live server 127.0.0.1:8095, see deploy/DEPLOY.md). The school API only
# runs when the service has SCHOOL_DB set (docs/SCHOLENPORTAAL.md).
#   sudo cp deploy/nginx-kwizillo-school.conf /etc/nginx/sites-available/kwizillo-school
#   sudo ln -s /etc/nginx/sites-available/kwizillo-school /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d school.kwizillo.nl
server {
    listen 80;
    listen [::]:80;
    server_name school.kwizillo.nl;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    # a pupil's saved game is sent whole; well under this
    client_max_body_size 512k;

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # the school API limits login attempts per address
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
