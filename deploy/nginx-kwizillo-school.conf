# Kwizillo voor scholen: school.kwizillo.nl -> the same Node service as the app
# (on the live server 127.0.0.1:8095, see deploy/DEPLOY.md). The school API only
# runs when the service has SCHOOL_DB set (docs/SCHOLENPORTAAL.md).
# The certificate already exists (certbot, 9 Oct 2026); do not run certbot --nginx
# again, it picked the website's block last time. Install:
#   sudo cp deploy/nginx-kwizillo-school.conf /etc/nginx/sites-available/kwizillo-school
#   sudo ln -sf /etc/nginx/sites-available/kwizillo-school /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# nginx 1.24 on the server: http2 goes on the listen line.

server {
    listen 80;
    listen [::]:80;
    server_name school.kwizillo.nl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name school.kwizillo.nl;

    ssl_certificate /etc/letsencrypt/live/school.kwizillo.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/school.kwizillo.nl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # a pupil's saved game is sent whole; well under this
    client_max_body_size 512k;

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # the school API limits login attempts per address
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
