# Kwizillo speech server only: app.kwizillo.nl / app.kwizillo.com -> Node on
# 127.0.0.1:8080. For a server whose website is already set up by hand; it
# leaves the kwizillo.nl / kwizillo.com site blocks alone.
#   sudo cp deploy/nginx-kwizillo-app.conf /etc/nginx/sites-available/kwizillo-app
#   sudo ln -s /etc/nginx/sites-available/kwizillo-app /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d app.kwizillo.nl -d app.kwizillo.com
server {
    listen 80;
    listen [::]:80;
    server_name app.kwizillo.nl app.kwizillo.com;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
