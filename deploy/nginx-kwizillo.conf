# Kwizillo — three server blocks for the existing nginx on 213.126.59.35.
#   kwizillo.nl / www       the Dutch site      (/var/www/kwizillo/site)
#   kwizillo.com / www      the English site    (same folder, pages under /en/)
#   app.kwizillo.nl / .com  the game + TTS proxy (Node on 127.0.0.1:8080)
#
# Install:  sudo cp deploy/nginx-kwizillo.conf /etc/nginx/sites-available/kwizillo
#           sudo ln -s /etc/nginx/sites-available/kwizillo /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# Then let certbot add HTTPS (it rewrites these blocks and adds the redirects):
#           sudo certbot --nginx -d kwizillo.nl -d www.kwizillo.nl -d app.kwizillo.nl \
#                                -d kwizillo.com -d www.kwizillo.com -d app.kwizillo.com

# Shared response headers for the site blocks.
map $sent_http_content_type $kw_cache {
    default                 "public, max-age=3600";
    ~image/                 "public, max-age=604800";
    text/css                "public, max-age=86400";
}

server {
    listen 80;
    listen [::]:80;
    server_name kwizillo.nl www.kwizillo.nl;

    root /var/www/kwizillo/site;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control $kw_cache;
    gzip on; gzip_types text/css application/javascript image/svg+xml;

    location ~ /\. { return 404; }            # never serve dot-files
    location / { try_files $uri $uri/ =404; }
}

server {
    listen 80;
    listen [::]:80;
    server_name kwizillo.com www.kwizillo.com;

    root /var/www/kwizillo/site;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control $kw_cache;
    gzip on; gzip_types text/css application/javascript image/svg+xml;

    location ~ /\. { return 404; }
    # Shared files stay where they are …
    location /assets/   { try_files $uri =404; }
    location = /style.css { try_files $uri =404; }
    location /en/       { try_files $uri $uri/ =404; }
    # … every other path is looked up under /en/ so kwizillo.com/privacy.html
    # shows the English privacy page.
    location / { try_files /en$uri /en$uri/index.html =404; }
}

server {
    listen 80;
    listen [::]:80;
    server_name app.kwizillo.nl app.kwizillo.com;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    client_max_body_size 64k;                 # /api/tts bodies are ≤ 8 KB

    location / {
        # Node serves the game files itself (byte ranges for the intro video,
        # its own cache headers) and answers /api/tts. X-Forwarded-For is what
        # server.js uses for the per-visitor rate limit when TRUST_PROXY=1.
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;               # TTS can take a few seconds
        proxy_buffering off;                  # stream audio/video as it comes
    }
}
